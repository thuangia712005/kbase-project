spring.application.name=kbase

spring.datasource.url=jdbc:postgresql://localhost:5433/kbase?options=-c%20TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=kbase-documents

# JWT
jwt.secret=ThisIsASecretKeyForKBaseProjectMustBeLongEnough123456
jwt.expiration=600000